name: Verify site source

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run verify
      - run: npm run build
      - name: Confirm generated site is committed
        run: git diff --exit-code -- index.html assets .nojekyll
